function loadMatchIntoForm(matchId) {
  const m = matchEvaluationsCache.find(x => x.id === matchId);
  if (!m) return;

  editingMatchId = m.id;
  selectedMatchPos = {
    first: m.firstHalfPosition || '선택 안됨',
    second: m.secondHalfPosition || '선택 안됨'
  };

  if (document.getElementById('matchPlayerSelect')) {
    document.getElementById('matchPlayerSelect').value = m.playerId || '';
    currentPlayerId = m.playerId;
    currentPlayerName = m.playerName;
  }
  if (document.getElementById('matchPlayerName')) {
    document.getElementById('matchPlayerName').value = m.playerName || '';
  }

  const photo = m.playerPhoto || (playersInfo[m.playerId]||{}).photo || '';
  currentMatchPlayerPhoto = photo;
  const pImg = document.getElementById('matchPlayerPhoto');
  if (pImg) pImg.src = getDriveImgUrl(photo) || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'110\' fill=\'%23cbd5e1\' viewBox=\'0 0 24 24\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>';

  const dEl = document.getElementById('matchDate'); if (dEl) dEl.value = m.matchDate || dateStr(new Date());
  const opEl = document.getElementById('matchOpponent'); if (opEl) opEl.value = m.opponent || '';
  const topEl = document.getElementById('matchPeriodTopic'); if (topEl) topEl.value = m.periodTopic || '';
  const goalEl = document.getElementById('matchIdpGoal'); if (goalEl) goalEl.value = m.idpGoal || '';
  const attEl = document.getElementById('matchAttempts'); if (attEl) attEl.value = m.attempts || 0;
  const sucEl = document.getElementById('matchSuccesses'); if (sucEl) sucEl.value = m.successes || 0;
  const rateEl = document.getElementById('matchSuccessRate'); if (rateEl) rateEl.innerText = m.successRate || '0%';
  const pfEl = document.getElementById('matchPlayerFeedback'); if (pfEl) pfEl.value = m.playerFeedback || '';
  const cfEl = document.getElementById('matchCoachFeedback'); if (cfEl) cfEl.value = m.coachFeedback || '';

  renderPitch('firstHalfPitchContainer', 'first', selectedMatchPos.first);
  renderPitch('secondHalfPitchContainer', 'second', selectedMatchPos.second);

  const t1 = document.getElementById('firstHalfPosText'); if (t1) t1.innerText = `전반: ${selectedMatchPos.first}`;
  const t2 = document.getElementById('secondHalfPosText'); if (t2) t2.innerText = `후반: ${selectedMatchPos.second}`;

  const card = document.getElementById('matchCard');
  if (card) card.scrollIntoView({ behavior: 'smooth' });

  uiToast(`[${m.matchDate} ${m.opponent || '경기'}] 평가를 불러왔습니다.`);
}

async function deleteMatchEvaluation(matchId) {
  if (!(await uiConfirm('이 경기 평가를 완전히 삭제하시겠습니까?\n삭제 후에는 복구할 수 없습니다.', '경기 평가 삭제'))) return;
  loading(true, '경기 평가를 삭제하는 중입니다...');
  try {
    const res = await api({ action: 'deleteMatchEvaluation', matchId, requesterId: currentUser.id });
    loading(false);
    if (res.ok) {
      uiToast('삭제되었습니다.');
      if (editingMatchId === matchId) resetMatchForm();
      await loadMatchList();
    } else {
      await uiAlert(res.error || '삭제 실패', '오류');
    }
  } catch (err) {
    loading(false);
    await uiAlert('오류: ' + err.message, '오류');
  }
}

async function renderCoachSidebar() {
  try {
    const sb = document.getElementById('sidebar');
    let baseHtml = `<button class="btn btn-black" onclick="showDashboard()"><i class="fa fa-table-columns"></i> 전체 대시보드</button><button class="btn btn-outline" onclick="showAnalytics()"><i class="fa fa-chart-pie"></i> 📊 심층 분석 대시보드</button><button class="btn btn-outline" onclick="showByType()"><i class="fa fa-layer-group"></i> 주기화별로 보기</button><button class="btn btn-outline" onclick="showMatchEvaluations()"><i class="fa fa-futbol"></i> ⚽ 경기 평가 관리</button><hr style="margin: 18px 0; border:0; border-top: 1px dashed #cbd5e1;"><h3 style="margin-top:0;">선수 선택 (조회/피드백)</h3><div id="playerPickArea">목록을 불러오는 중입니다...</div>`;
    sb.innerHTML = baseHtml;
    const res = await api({ action:'listUsers' });
    if (!res.ok) { document.getElementById('playerPickArea').innerHTML = `<div style="color:var(--red); font-size:12px;">오류: ${res.error}</div>`; return; }

    if (currentUser.isAdmin) {
      const pendingUsers = res.users.filter(u => u.granted === false && u.isAdmin === false);
      sb.insertAdjacentHTML('beforeend', `<hr style="margin: 20px 0; border:0; border-top: 1px solid #cbd5e1;"><h3 style="margin-top:0;">가입 승인 대기</h3><div id="pendingArea"></div><hr style="margin: 15px 0; border:0; border-top: 1px dashed #cbd5e1;"><h3 style="margin-top:0;">권한 관리</h3><div id="permArea"></div><hr style="margin: 15px 0; border:0; border-top: 1px dashed #cbd5e1;"><h3 style="margin-top:0;">선수 계정 관리</h3><div id="playerMgmtArea"></div>`);

    const players = res.users.filter(u => u.role === 'player');

    if (currentUser.isAdmin) renderPlayerMgmt(players); 
  } catch (e) { console.error("Sidebar Rendering Error:", e); uiAlert("사이드바 로딩 중 오류가 발생했습니다.", "시스템 오류"); }

}

async function onPlayerChange(){

  currentPlayerId = sel.value; currentPlayerName = sel.options[sel.selectedIndex].text;
  currentEntry = null; showEmpty();

/* ---------- 🚀 전체 대시보드 ---------- */
function renderDashboardFromData(res) {
  if (!res || !res.users) return;
  const players = res.users.filter(u => u.role==='player');
  const allDiariesMap = {};
  players.forEach(p => {
    allDiariesMap[p.id] = (res.diaries || []).filter(d => d.playerId === p.id).map(d => {
      if(String(d.date).includes('T')) d.date = String(d.date).split('T')[0];
      return d;
    });
  });

  const pendingFeedbacks = (res.entries || []).filter(e => { const noText = !e.coachFeedback || e.coachFeedback.trim() === ''; return noText; }).sort((a,b) => new Date(b.weekStartDate) - new Date(a.weekStartDate));
  let pendingHtml = '';
  if (pendingFeedbacks.length > 0) {
    pendingHtml = `<div class="alert-box"><h4><i class="fa fa-bell"></i> 지도자 피드백 요망 (${pendingFeedbacks.length}건)</h4><div style="max-height:160px; overflow-y:auto;">${pendingFeedbacks.map(pf => `<div class="alert-item" onclick="openDashboardEntry('${pf.playerId}', '${esc(pf.playerName)}', '${pf.type}', '${pf.entryId}')"><span><b>${pf.playerName}</b> · ${JOURNAL_TYPES[pf.type].title}</span><span>${(pf.weekLabel||pf.weekStartDate)} <i class="fa fa-arrow-right" style="margin-left:4px; opacity:0.5;"></i></span></div>`).join('')}</div></div>`;
  }

  const thisMonday = dateStr(monday(new Date()));
  const types = Object.keys(JOURNAL_TYPES);
  let pSum=0, cSum=0, count=0;

  const rows = players.map(p => {
    const cycleCells = types.map(t => {
      const es = (res.entries || []).filter(e => e.playerId===p.id && e.type===t && e.playerScores).sort((a,b)=> new Date(b.weekStartDate)-new Date(a.weekStartDate));
      const latest = es[0];
      if (!latest) return `<td class="dash-cell" style="text-align:center; color:#cbd5e1; padding:8px; border:1px solid #e2e8f0;" onclick="uiToast('작성된 일지가 없습니다.','info')">미작성</td>`;
      const done = latest.weekStartDate >= thisMonday;
      let attAvg = 0, sucAvg = 0;
      if (latest.dailyAttempts) { attAvg = avg(latest.playerScores); sucAvg = avg(latest.coachScores); pSum += attAvg; cSum += sucAvg; count++; }
      return `<td class="dash-cell" style="text-align:center; padding:8px; border:1px solid #e2e8f0; background:${done?'#f0fdf4':'white'};" onclick="openDashboardEntry('${p.id}', '${esc(p.name)}', '${t}', '${latest.entryId}')"><div style="font-size:10px; color:${done?'#16a34a':'#ef4444'}; font-weight:bold;">${done?'✔ 이번 바퀴 작성':'⚠ '+(latest.weekLabel||latest.weekStartDate)}</div><div style="font-size:10.5px;">시도 ${attAvg}회 / 성공 ${sucAvg}회</div></td>`;
    }).join('');

    const pDiaries = allDiariesMap[p.id].sort((a,b) => new Date(b.date) - new Date(a.date));
    const latestDiary = pDiaries.length > 0 ? pDiaries[0] : null;
    let diaryCell = '';
    if (!latestDiary) {
      diaryCell = `<td class="dash-cell" style="text-align:center; color:#cbd5e1; padding:8px; border:1px solid #e2e8f0;" onclick="uiToast('작성된 포토 일지가 없습니다.','info')">미작성</td>`;
    } else {
      const recentDiariesThisWeek = pDiaries.filter(d => d.date >= thisMonday);
      const doneThisWeek = recentDiariesThisWeek.length > 0;
      diaryCell = `<td class="dash-cell" style="text-align:center; padding:8px; border:1px solid #e2e8f0; background:${doneThisWeek?'#f0fdf4':'white'};" onclick="openDashboardDiary('${p.id}', '${esc(p.name)}', '${latestDiary.date}')"><div style="font-size:10px; color:${doneThisWeek?'#16a34a':'#ef4444'}; font-weight:bold;">${doneThisWeek ? `✔ 이번 주 ${recentDiariesThisWeek.length}건` : `⚠ 최근: ${latestDiary.date}`}</div></td>`;
    }
    return `<tr style="border-bottom:1px solid #eee;"><td style="font-weight:bold; padding:8px; white-space:nowrap; border:1px solid #e2e8f0; border-left:none;">${p.photo?`<img src="${p.photo}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">`:''}${p.name}</td>${cycleCells}${diaryCell}</tr>`;
  }).join('');

  document.getElementById('dashboardCard').innerHTML = `${pendingHtml}<h2 style="margin:0 0 4px;">전체 대시보드</h2><div style="font-size:11px; color:#64748b; margin-bottom:16px;">이번 바퀴(${thisMonday}~) 기준 작성 현황 (클릭 시 일지로 바로 이동)</div><div style="display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;"><div style="flex:1; min-width:140px; background:#fff5f5; border:1px solid #f1948a; border-radius:8px; padding:14px; text-align:center;"><div style="font-size:11px; color:#64748b;">팀 평균 (시도 횟수)</div><div style="font-size:24px; font-weight:900; color:var(--red);">${count?Math.round(pSum/count*10)/10:0}회</div></div><div style="flex:1; min-width:140px; background:#f0f9ff; border:1px solid #7dd3fc; border-radius:8px; padding:14px; text-align:center;"><div style="font-size:11px; color:#64748b;">팀 평균 (성공 횟수)</div><div style="font-size:24px; font-weight:900; color:#0284c7;">${count?Math.round(cSum/count*10)/10:0}회</div></div></div><div class="table-responsive"><table style="width:100%; border-collapse:collapse; font-size:11.5px; min-width:650px;"><thead><tr style="background:var(--black); color:white;"><th style="padding:10px 8px; text-align:left; border-right:1px solid #475569;">선수</th>${types.map(t=>`<th style="padding:10px 8px; border-right:1px solid #475569;">${JOURNAL_TYPES[t].title}</th>`).join('')}<th style="padding:10px 8px;">📷 포토 일지</th></tr></thead><tbody>${rows || `<tr><td colspan="${types.length+2}" style="text-align:center; color:#94a3b8; padding:20px;">등록된 선수가 없습니다.</td></tr>`}</tbody></table></div>`;
}

function getQuarterFromDate(dateStr) {
  const m = parseInt(dateStr.split('-')[1]);
  if(m<=3) return 'q1'; if(m<=6) return 'q2'; if(m<=9) return 'q3'; return 'q4';
}

}

function renderPlayerAnalytics() {
  const basePlayerId = document.getElementById('analyticsPlayer').value;
  const comparePlayerId = document.getElementById('analyticsComparePlayer').value;
  const type = document.getElementById('analyticsType').value;
  const period = document.getElementById('analyticsPeriod').value;
  
  if (!basePlayerId) { document.getElementById('analyticsContent').style.display = 'none'; document.getElementById('analyticsEmpty').innerText = '기준 선수를 선택해주세요.'; document.getElementById('analyticsEmpty').style.display = 'block'; return; }
  
  const filteredEntries = byTypeCache.entries.filter(e => { if(e.type !== type) return false; if(period !== 'all' && getQuarterFromDate(e.weekStartDate) !== period) return false; return true; });
  const baseEntries = filteredEntries.filter(e => e.playerId === basePlayerId).sort((a,b)=> new Date(a.weekStartDate)-new Date(b.weekStartDate));
  const compareEntries = comparePlayerId ? filteredEntries.filter(e => e.playerId === comparePlayerId).sort((a,b)=> new Date(a.weekStartDate)-new Date(b.weekStartDate)) : [];
  
  if (baseEntries.length === 0) { document.getElementById('analyticsContent').style.display = 'none'; document.getElementById('analyticsEmpty').innerText = '선택한 기간/유형에 해당하는 훈련 일지가 없습니다.'; document.getElementById('analyticsEmpty').style.display = 'block'; return; }

  const cats = JOURNAL_TYPES[type].categories;
  const baseName = document.getElementById('analyticsPlayer').options[document.getElementById('analyticsPlayer').selectedIndex].text;
  const compareName = comparePlayerId ? document.getElementById('analyticsComparePlayer').options[document.getElementById('analyticsComparePlayer').selectedIndex].text : '';

  let playerAverages = {};
  filteredEntries.forEach(e => {
    if(!playerAverages[e.playerId]) playerAverages[e.playerId] = { sum:0, count:0 };
    const attAvg = e.dailyAttempts ? avg(e.playerScores) : 0; 
    if(attAvg > 0) { playerAverages[e.playerId].sum += attAvg; playerAverages[e.playerId].count++; }
  });
  
  let rankingList = Object.keys(playerAverages).map(pid => { return { id: pid, avg: playerAverages[pid].count > 0 ? (playerAverages[pid].sum / playerAverages[pid].count) : 0 }; }).filter(p => p.avg > 0).sort((a,b) => b.avg - a.avg); 
  const totalPlayers = rankingList.length; const myRankIdx = rankingList.findIndex(p => p.id === basePlayerId);
  let percentileStr = ''; let baseOverallAvg = 0;
  if(myRankIdx !== -1) {
    const myRank = myRankIdx + 1; const percentile = Math.round((myRank / totalPlayers) * 100); baseOverallAvg = Math.round(rankingList[myRankIdx].avg * 10) / 10;
    percentileStr = `${baseName} 선수의 평균 시도는 <span style="color:var(--black);">${baseOverallAvg}회</span>입니다. (팀 내 <span style="color:var(--red);">상위 ${percentile}%</span>, ${totalPlayers}명 중 ${myRank}위)`;
  } else percentileStr = '시도 횟 데이터가 부족합니다.';

  document.getElementById('analyticsContent').innerHTML = `
      <div id="analyticsSummary" style="background:#fff5f5; border:1px solid #fca5a5; border-radius:8px; padding:16px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div><div style="font-size:12px; color:var(--red); font-weight:bold;">해당 기간 종합 평가 (선수 평균 시도 횟수 기준)</div><div style="font-size:18px; font-weight:900; margin-top:4px;">${percentileStr}</div></div>
        <button class="btn btn-blue" onclick="generatePDFReport()" style="margin:0; width:auto; white-space:nowrap;"><i class="fa fa-file-pdf"></i> 분기별 리포트 다운로드</button>
      </div>
      <div class="charts-row" style="margin-top:0;">
        <div class="chart-box" style="width:400px; max-width:100%;"><h4>선수별 시도 횟수 밸런스</h4><div id="radarCaptureArea" style="background:white; padding:10px; border-radius:8px;"><canvas id="analyticsRadar"></canvas></div></div>
        <div class="chart-box" style="width:500px; max-width:100%;"><h4>바퀴별 시도 및 성공 추이</h4><div id="lineCaptureArea" style="background:white; padding:10px; border-radius:8px;"><canvas id="analyticsLine"></canvas></div></div>
      </div>`;
  document.getElementById('analyticsContent').style.display = 'block'; document.getElementById('analyticsEmpty').style.display = 'none';

  setTimeout(() => {
    let baseCatSums = cats.map(()=>0), baseCatCounts = cats.map(()=>0); let compCatSums = cats.map(()=>0), compCatCounts = cats.map(()=>0); let teamCatSums = cats.map(()=>0), teamCatCounts = cats.map(()=>0);
    baseEntries.forEach(e => { if(e.dailyAttempts) e.playerScores.forEach((score, i) => { if(score > 0) { baseCatSums[i] += score; baseCatCounts[i]++; } }); });
    compareEntries.forEach(e => { if(e.dailyAttempts) e.playerScores.forEach((score, i) => { if(score > 0) { compCatSums[i] += score; compCatCounts[i]++; } }); });
    filteredEntries.forEach(e => { if(e.dailyAttempts) e.playerScores.forEach((score, i) => { if(score > 0) { teamCatSums[i] += score; teamCatCounts[i]++; } }); });

    const baseCatAvgs = baseCatSums.map((sum, i) => baseCatCounts[i] ? Math.round(sum/baseCatCounts[i]*10)/10 : 0);
    const compCatAvgs = compCatSums.map((sum, i) => compCatCounts[i] ? Math.round(sum/compCatCounts[i]*10)/10 : 0);
    const teamCatAvgs = teamCatSums.map((sum, i) => teamCatCounts[i] ? Math.round(sum/teamCatCounts[i]*10)/10 : 0);

    let radarDatasets = [{ label: `${baseName} (기준)`, data: baseCatAvgs, backgroundColor: 'rgba(227,6,19,0.3)', borderColor: '#E30613', pointBackgroundColor: '#E30613' }, { label: '팀 평균 시도', data: teamCatAvgs, backgroundColor: 'transparent', borderColor: '#94a3b8', borderDash: [5,5], pointBackgroundColor: '#94a3b8' }];
    if(comparePlayerId) radarDatasets.push({ label: `${compareName} (비교)`, data: compCatAvgs, backgroundColor: 'rgba(2,132,199,0.2)', borderColor: '#0284c7', pointBackgroundColor: '#0284c7' });
    if(analyticsRadarChart) analyticsRadarChart.destroy();
    analyticsRadarChart = new Chart(document.getElementById('analyticsRadar'), { type: 'radar', data: { labels: cats, datasets: radarDatasets }, options: { responsive: true, plugins: { datalabels: { display: false } } } });

    let allDates = new Set(); baseEntries.forEach(e => allDates.add(e.weekStartDate)); compareEntries.forEach(e => allDates.add(e.weekStartDate));
    const sortedDates = Array.from(allDates).sort((a,b) => new Date(a) - new Date(b));
    const attLineData = sortedDates.map(d => { const e = baseEntries.find(x => x.weekStartDate===d); return (e && e.dailyAttempts) ? avg(e.playerScores) : null; });
    const sucLineData = sortedDates.map(d => { const e = baseEntries.find(x => x.weekStartDate===d); return (e && e.dailyAttempts) ? avg(e.coachScores) : null; });

    let lineDatasets = [{ label: `${baseName} (평균 시도)`, data: attLineData, borderColor: '#E30613', backgroundColor: '#E30613', tension: 0.2, spanGaps: true }, { label: `${baseName} (평균 성공)`, data: sucLineData, borderColor: '#0284c7', backgroundColor: '#0284c7', tension: 0.2, spanGaps: true }];
    if(analyticsLineChart) analyticsLineChart.destroy();
    analyticsLineChart = new Chart(document.getElementById('analyticsLine'), { type: 'line', data: { labels: sortedDates, datasets: lineDatasets }, options: { responsive: true, scales: { y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '횟수 (회)', color: '#1a1a1a', font: {weight:'bold'} }, min: 0 } }, plugins: { datalabels: { display: false } } } });
    reportData = { baseName, typeTitle: JOURNAL_TYPES[type].title, periodName: document.getElementById('analyticsPeriod').options[document.getElementById('analyticsPeriod').selectedIndex].text, baseOverallAvg, percentileStr, latestFeedbacks: baseEntries.slice(-3).map(e => ({ week: e.weekLabel||e.weekStartDate, text: e.coachFeedback })) };
  }, 50);
}

// 🌟 주차별 팀 분석: 산점도(점 찍기) 및 선수 이름 항상 표시 기능 복구
function renderWeekAnalytics() {
  const type = document.getElementById('analyticsWeekType').value;
  const week = document.getElementById('analyticsWeekSelect').value;
  if (!week) { document.getElementById('analyticsContent').style.display = 'none'; document.getElementById('analyticsEmpty').innerText = '분석할 바퀴를 선택해주세요.'; document.getElementById('analyticsEmpty').style.display = 'block'; return; }
  
  const entries = byTypeCache.entries.filter(e => e.type === type && e.weekStartDate === week && e.dailyAttempts);
  if (entries.length === 0) { document.getElementById('analyticsContent').style.display = 'none'; document.getElementById('analyticsEmpty').innerText = '선택한 바퀴에 새로 입력된 시도/성공 데이터가 없습니다.'; document.getElementById('analyticsEmpty').style.display = 'block'; return; }

  let teamAttSums = 0, teamSucSums = 0; let overallCount = entries.length;
  
  const scatterData = entries.map(e => {
    const attAvg = avg(e.playerScores);
    const sucAvg = avg(e.coachScores);
    teamAttSums += attAvg;
    teamSucSums += sucAvg;
    return { x: attAvg, y: sucAvg, name: e.playerName };
  });

  const teamAttAvg = overallCount > 0 ? Math.round(teamAttSums/overallCount*10)/10 : 0;
  const teamSucAvg = overallCount > 0 ? Math.round(teamSucSums/overallCount*10)/10 : 0;

  document.getElementById('analyticsContent').innerHTML = `
    <div style="background:#f0f9ff; border:1px solid #7dd3fc; border-radius:8px; padding:16px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div style="flex:1;"><div style="font-size:12px; color:#0284c7; font-weight:bold;">${entries[0].weekLabel || week} 팀 전체 요약</div><div style="font-size:20px; font-weight:900; margin-top:4px;">팀 평균 시도: ${teamAttAvg}회 <span style="font-weight:normal; margin:0 8px;">/</span> 팀 평균 성공: ${teamSucAvg}회</div><div style="font-size:11px; color:#64748b; margin-top:2px;">제출 및 평가 완료 선수: ${overallCount}명</div></div>
    </div>
    <div class="charts-row" style="margin-top:0; align-items: flex-start;">
      <div class="chart-box" style="width:100%; max-width:800px; flex: 1; min-width: 300px;">
        <h4>선수별 시도 vs 성공 분포도 (산점도)</h4>
        <div style="background:white; padding:20px; border: 1px solid #cbd5e1; border-radius:8px; overflow-x:auto;">
           <canvas id="analyticsScatter" style="min-width: 600px; height:400px;"></canvas>
        </div>
        <div style="font-size:11px; color:#64748b; margin-top:10px;">* 각 점은 선수를 나타냅니다. (우측 상단으로 갈수록 시도와 성공이 모두 높습니다)</div>
      </div>
    </div>`;
  document.getElementById('analyticsContent').style.display = 'block'; document.getElementById('analyticsEmpty').style.display = 'none';

  setTimeout(() => {
    if(analyticsLineChart) analyticsLineChart.destroy();
    if(analyticsRadarChart) analyticsRadarChart.destroy(); 
    
    analyticsLineChart = new Chart(document.getElementById('analyticsScatter'), {
      type: 'scatter',
      data: {
        datasets: [{
          label: '선수 분포',
          data: scatterData,
          backgroundColor: '#E30613',
          borderColor: '#E30613',
          pointRadius: 6,
          pointHoverRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const pt = ctx.raw;
                return `${pt.name} (시도 ${pt.x}회, 성공 ${pt.y}회)`;
              }
            }
          },
          datalabels: {
            display: true,
            color: '#1a1a1a',
            align: 'top',
            offset: 4,
            font: { weight: 'bold', size: 12 },
            formatter: (value) => { return value.name; }
          }
        },
        scales: {
          x: { 
            title: { display: true, text: '평균 시도 횟수 (X축)', font: {weight:'bold'} }, 
            min: 0,
            ticks: { font: { weight: 'bold' } }
          },
          y: { 
            beginAtZero: true, 
            title: { display: true, text: '평균 성공 횟수 (Y축)', font: {weight:'bold'} } 
          }
        }
      }
    });
  }, 50);
}

/* ---------- 📄 학부모 상담용 리포트 (PDF) ---------- */
async function generatePDFReport() {
  if(!reportData) return;
  loading(true, 'PDF 리포트를 생성하는 중입니다...');
  try {
    const { jsPDF } = window.jspdf;
    
    const originalScrollY = window.scrollY;
    window.scrollTo(0, 0);
    
    const radarCanvas = await html2canvas(document.getElementById('radarCaptureArea'), { scale: 2, backgroundColor: '#ffffff', scrollY: 0 });
    const lineCanvas = await html2canvas(document.getElementById('lineCaptureArea'), { scale: 2, backgroundColor: '#ffffff', scrollY: 0 });
    
    const container = document.getElementById('pdfReportContainer');
    let feedbacksHtml = reportData.latestFeedbacks.filter(f=>f.text).map(f => `<div style="margin-bottom:10px;"><b>[${f.week}]</b><br>${esc(f.text)}</div>`).join('');
    if(!feedbacksHtml) feedbacksHtml = '<div style="color:#94a3b8;">최근 피드백이 없습니다.</div>';

    container.innerHTML = `
      <div class="pdf-header">
        <h1>FC SEOUL 선수 종합 리포트</h1>
        <p>${reportData.typeTitle} / ${reportData.periodName} 기준</p>
      </div>
      <div style="font-size:16px; font-weight:bold; margin-bottom:10px;">선수 이름: ${reportData.baseName}</div>
      <div class="pdf-box" style="margin-bottom:20px; font-size:14px; line-height:1.6;">${reportData.percentileStr}</div>
      <div class="pdf-row">
        <div class="pdf-col pdf-box"><h3>세부 항목별 밸런스</h3><img src="${radarCanvas.toDataURL('image/png')}" style="width:100%; max-width:300px; display:block; margin:0 auto;"></div>
        <div class="pdf-col pdf-box"><h3>바퀴별 시도 및 성공 추이</h3><img src="${lineCanvas.toDataURL('image/png')}" style="width:100%; max-width:350px; display:block; margin:0 auto;"></div>
      </div>
      <div class="pdf-box"><h3>최근 주요 지도자 피드백</h3><div style="font-size:12px; line-height:1.5;">${feedbacksHtml}</div></div>
      <div style="text-align:right; font-size:10px; color:#94a3b8; margin-top:30px;">출력일: ${dateStr(new Date())}</div>
    `;

    const reportCanvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff', width: 800, scrollY: 0 });
    const imgData = reportCanvas.toDataURL('image/png');
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = (reportCanvas.height * pdfWidth) / reportCanvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    
    window.scrollTo(0, originalScrollY);
    
    pdf.save(`FC_SEOUL_리포트_${reportData.baseName}_${dateStr(new Date())}.pdf`);
    uiToast('PDF 다운로드가 완료되었습니다.');
  } catch (err) { uiAlert('PDF 생성 중 오류가 발생했습니다: ' + err.message, '오류'); } finally { loading(false); }
}

/* ---------- 🔄 주기화별로 보기 ---------- */
async function showByType(){
  await flushPendingSaves(); 
  hidePanels(); document.getElementById('byTypeWrapper').style.display = 'block';

  function renderByTypeShell() {
    const types = Object.keys(JOURNAL_TYPES);
    document.getElementById('byTypeCard').innerHTML = `
      <h2 style="margin:0 0 14px;">주기화별로 보기</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; position:relative; z-index:100;">
        <select id="byTypeType" onchange="onByTypeTypeChange()" style="flex:1; min-width:120px; border:1px solid #cbd5e1; padding:8px; border-radius:5px; pointer-events:auto;">${types.map(t=>`<option value="${t}">${JOURNAL_TYPES[t].title}</option>`).join('')}</select>
        <select id="byTypeWeek" onchange="onByTypeWeekChange()" style="flex:1; min-width:160px; border:1px solid #cbd5e1; padding:8px; border-radius:5px; pointer-events:auto;"><option value="">-- 저장된 바퀴에서 선택 --</option></select>
        <span style="font-size:11px; color:#94a3b8; padding:0 4px;">또는</span>
        <input type="date" id="byTypeDate" onchange="onByTypeDateChange()" style="flex:1; min-width:140px; border:1px solid #cbd5e1; padding:8px; border-radius:5px; pointer-events:auto;">
      </div>
      <div id="byTypeResults"></div>`;
    refreshByTypeWeeks();
  }

  if (byTypeCache && byTypeCache.users) {
    renderByTypeShell();
  } else {
    document.getElementById('byTypeCard').innerHTML = '<div style="padding:20px 0;"><div class="dash-skeleton-cell" style="width:160px; height:24px; margin-bottom:16px;"></div><div class="dash-skeleton-cell" style="width:100%; height:45px;"></div></div>';
  }

  const res = await api({ action:'getAllData', requesterId: currentUser.id }, true);
  if (res && res.ok) {
    byTypeCache = res;
    renderByTypeShell();
  }
}
function refreshByTypeWeeks(){
  const type = document.getElementById('byTypeType').value;
  const map = {};
  byTypeCache.entries.filter(e=>e.type===type).forEach(e => map[e.weekStartDate] = e.weekLabel || e.weekStartDate);
  const weeks = Object.keys(map).sort((a,b)=> new Date(b)-new Date(a));
  document.getElementById('byTypeWeek').innerHTML = '<option value="">-- 저장된 바퀴에서 선택 --</option>' + weeks.map(w=>`<option value="${w}">${map[w]} (${w})</option>`).join('');
}
function onByTypeTypeChange(){ refreshByTypeWeeks(); document.getElementById('byTypeDate').value=''; document.getElementById('byTypeResults').innerHTML=''; }
function onByTypeWeekChange(){
  const w = document.getElementById('byTypeWeek').value; document.getElementById('byTypeDate').value='';
  if (w) renderByTypeResults(document.getElementById('byTypeType').value, w); else document.getElementById('byTypeResults').innerHTML='';
}
function onByTypeDateChange(){
  const d = document.getElementById('byTypeDate').value; document.getElementById('byTypeWeek').value='';
  if (d) renderByTypeResults(document.getElementById('byTypeType').value, d);
}
function renderByTypeResults(type, week){
  const players = byTypeCache.users.filter(u=>u.role==='player');
  const submitted = [], missing = [];
  players.forEach(p => {
    const entry = byTypeCache.entries.find(e => e.playerId===p.id && e.type===type && e.weekStartDate===week);
    (entry ? submitted.push({p,entry}) : missing.push(p));
  });
  
  document.getElementById('byTypeResults').innerHTML = `
    <div style="display:flex; gap:24px; flex-wrap:wrap;">
      <div style="flex:1; min-width:220px;"><h4 style="color:#16a34a;">✔ 제출함 (${submitted.length})</h4>
        ${submitted.length ? submitted.map(s=>`<div class="list-item" style="cursor:pointer;" onclick="openDashboardEntry('${s.p.id}','${esc(s.p.name)}','${s.entry.type}', '${s.entry.entryId}')">
          <span>${s.p.photo?`<img src="${s.p.photo}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">`:''}${s.p.name}</span>
          <span style="font-size:10px; color:#64748b;">평균 시도 ${(s.entry.dailyAttempts ? avg(s.entry.playerScores) : 0)} / 성공 ${(s.entry.dailyAttempts ? avg(s.entry.coachScores) : 0)}</span></div>`).join('') : '<div style="font-size:11.5px; color:#94a3b8;">없음</div>'}</div>
      <div style="flex:1; min-width:220px;"><h4 style="color:#ef4444;">⚠ 미제출 (${missing.length})</h4>
        ${missing.length ? missing.map(p=>`<div class="list-item" style="opacity:.55;"><span>${p.photo?`<img src="${p.photo}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">`:''}${p.name}</span></div>`).join('') : '<div style="font-size:11.5px; color:#94a3b8;">없음</div>'}</div>
    </div>`;
}

/* ---------- 🌟 엑셀 백업 ---------- */
async function exportExcel(){
  loading(true, '전체 데이터를 수집 중입니다.<br>시간이 다소 소요될 수 있습니다...');
  const res = await api({ action:'getAllData', requesterId: currentUser.id }, true);
  if (!res.ok) { loading(false); await uiAlert(res.error, '오류'); return; }

  const players = res.users.filter(u => u.role === 'player');
  const allDiaries = (res.diaries || []).map(d => {
    const p = players.find(x => x.id === d.playerId);
    return { ...d, playerName: p ? p.name : (d.playerName || d.playerId) };
  });

  const summary = res.entries.map(e => ({
    '선수명': e.playerName,
    '훈련 유형': (JOURNAL_TYPES[e.type]||{}).title || e.type,
    '바퀴 라벨': e.weekLabel || e.weekStartDate,
    '시작일': e.weekStartDate,
    '평균 시도 횟수': e.dailyAttempts ? avg(e.playerScores) : 0,
    '평균 성공 횟수': e.dailyAttempts ? avg(e.coachScores) : 0,
    '선수 의견': e.playerComment || '',
    '지도자 피드백': e.coachFeedback || '',
    '업데이트 일시': e.updatedAt
  }));

  const detailed = res.entries.map(e => {
    const cats = (JOURNAL_TYPES[e.type]||{}).categories || ['1주차','2주차','3주차','4주차','5주차'];
    let row = {
      '선수명': e.playerName,
      '훈련 유형': (JOURNAL_TYPES[e.type]||{}).title || e.type,
      '바퀴 라벨': e.weekLabel || e.weekStartDate,
      '시작일': e.weekStartDate
    };
    cats.forEach((c, i) => { row[`[평균 시도 횟수] ${c}`] = e.dailyAttempts ? (e.playerScores[i] || 0) : 0; });
    cats.forEach((c, i) => { row[`[평균 성공 횟수] ${c}`] = e.dailyAttempts ? (e.coachScores[i] || 0) : 0; });
    DAYS.forEach(day => { 
      cats.forEach((c, i) => { 
        const status = e.dayStatus && e.dayStatus[day] && e.dayStatus[day][i] ? e.dayStatus[day][i] : 'normal';
        const statusStr = status === 'rest' ? '[휴식] ' : status === 'injury' ? '[부상] ' : status === 'gym' ? '[헬스장] ' : '';
        row[`[${day} 목적] ${c}`] = statusStr + (e.goals && e.goals[day] ? e.goals[day][i] || '' : ''); 
        row[`[${day} 시도] ${c}`] = e.dailyAttempts && e.dailyAttempts[day] ? e.dailyAttempts[day][i] || 0 : 0; 
        row[`[${day} 성공] ${c}`] = e.dailySuccesses && e.dailySuccesses[day] ? e.dailySuccesses[day][i] || 0 : 0; 
      }); 
    });
    cats.forEach((c, i) => { row[`[선수 질문] ${c}`] = e.playerQuestions && e.playerQuestions[i] ? e.playerQuestions[i] : ''; });
    cats.forEach((c, i) => { row[`[영상] ${c}`] = e.videos && e.videos[i] ? e.videos[i].url || '' : ''; });
    return row;
  });

  const diarySheetData = allDiaries.map(d => ({
    '선수명': d.playerName,
    '작성 날짜': String(d.date).split('T')[0],
    '메모 내용': d.memo || '',
    '사진 URL': d.photoUrl || '',
    '시스템 등록일시': d.createdAt || ''
  }));

  const matchSheetData = (res.matchEvaluations || []).map(m => ({
    '선수명': m.playerName || '',
    '경기 일자': m.matchDate || '',
    '상대팀 / 경기종류': m.opponent || '',
    '전반전 포지션': m.firstHalfPosition || '',
    '후반전 포지션': m.secondHalfPosition || '',
    '주기화 주제': m.periodTopic || '',
    'IDP 개인목표': m.idpGoal || '',
    '시도 횟수': m.attempts || 0,
    '성공 횟수': m.successes || 0,
    '성공률': m.successRate || '0%',
    '선수 자가피드백': m.playerFeedback || '',
    '지도자 피드백': m.coachFeedback || '',
    '제출/등록 일시': m.createdAt || ''
  }));

  const users = res.users.map(u => ({
    '이름': u.name,
    '아이디(이메일)': u.id,
    '계정 역할': u.role === 'player' ? '선수' : '지도자',
    '전체조회 권한': u.granted ? 'O' : 'X',
    '관리자 여부': u.isAdmin ? 'O' : 'X'
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "주기화 요약");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailed), "주기화 세부 데이터(전체)");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matchSheetData), "경기 평가");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(diarySheetData), "포토 일지 통합");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(users), "사용자 목록");

  XLSX.writeFile(wb, `FC_SEOUL_전체데이터_백업_${dateStr(new Date())}.xlsx`);
  loading(false);
  uiToast('엑셀 파일(전체 통합본)이 다운로드되었습니다.');
}
</script>
